
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">

  <title>Cadastrar empresa | NEKKO WD</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nekko: {
              bg: '#090909',
              surface: '#111111',
              border: '#292929',
              orange: '#C65A16',
              light: '#F28A3D'
            }
          }
        }
      }
    };
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-nekko-bg text-white flex items-center justify-center px-4 py-10">

  <main class="w-full max-w-xl">

    <header class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl border border-nekko-orange/30 bg-nekko-orange/10">
        <i data-lucide="building-2" class="h-8 w-8 text-nekko-light"></i>
      </div>

      <h1 class="text-3xl font-bold">
        NEKKO <span class="text-nekko-light">WD</span>
      </h1>

      <p class="mt-3 text-sm text-gray-400">
        Vamos configurar sua marcenaria.
      </p>
    </header>

    <section class="rounded-2xl border border-nekko-border bg-nekko-surface p-6 shadow-2xl sm:p-8">

      <div class="mb-7">
        <div class="mb-3 flex items-center gap-2">
          <span class="flex h-7 w-7 items-center justify-center rounded-full bg-nekko-orange text-sm font-bold">1</span>
          <span class="text-xs font-medium uppercase tracking-wider text-nekko-light">
            Etapa 1 de 2
          </span>
        </div>

        <h2 class="text-xl font-semibold">Dados da empresa</h2>
        <p class="mt-1 text-sm text-gray-400">
          Informe os dados principais para começar a usar o sistema.
        </p>
      </div>

      <div
        id="message"
        class="hidden mb-5 rounded-lg border p-3 text-sm"
        role="status"
        aria-live="polite"
      ></div>

      <form id="companyForm" class="space-y-5">

        <div>
          <label for="companyName" class="mb-2 block text-sm font-medium text-gray-300">
            Nome da marcenaria *
          </label>

          <input
            id="companyName"
            name="companyName"
            type="text"
            maxlength="120"
            placeholder="Ex.: Marcenaria São José"
            required
            class="w-full rounded-lg border border-nekko-border bg-black px-4 py-3 outline-none transition focus:border-nekko-orange focus:ring-2 focus:ring-nekko-orange/20"
          >
        </div>

        <div>
          <label for="document" class="mb-2 block text-sm font-medium text-gray-300">
            CNPJ ou CPF <span class="text-gray-500">(opcional)</span>
          </label>

          <input
            id="document"
            name="document"
            type="text"
            maxlength="30"
            placeholder="Documento da empresa"
            class="w-full rounded-lg border border-nekko-border bg-black px-4 py-3 outline-none transition focus:border-nekko-orange focus:ring-2 focus:ring-nekko-orange/20"
          >
        </div>

        <div>
          <label for="phone" class="mb-2 block text-sm font-medium text-gray-300">
            Telefone comercial <span class="text-gray-500">(opcional)</span>
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            maxlength="20"
            placeholder="(11) 99999-9999"
            class="w-full rounded-lg border border-nekko-border bg-black px-4 py-3 outline-none transition focus:border-nekko-orange focus:ring-2 focus:ring-nekko-orange/20"
          >
        </div>

        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-gray-300">
            E-mail comercial <span class="text-gray-500">(opcional)</span>
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="contato@marcenaria.com.br"
            class="w-full rounded-lg border border-nekko-border bg-black px-4 py-3 outline-none transition focus:border-nekko-orange focus:ring-2 focus:ring-nekko-orange/20"
          >
        </div>

        <div>
          <label for="address" class="mb-2 block text-sm font-medium text-gray-300">
            Endereço <span class="text-gray-500">(opcional)</span>
          </label>

          <input
            id="address"
            name="address"
            type="text"
            maxlength="200"
            placeholder="Rua, número, cidade..."
            class="w-full rounded-lg border border-nekko-border bg-black px-4 py-3 outline-none transition focus:border-nekko-orange focus:ring-2 focus:ring-nekko-orange/20"
          >
        </div>

        <button
          id="continueButton"
          type="submit"
          class="flex w-full items-center justify-center gap-2 rounded-lg bg-nekko-orange px-4 py-3 font-semibold transition hover:bg-nekko-light hover:text-black disabled:cursor-not-allowed disabled:opacity-60"
        >
          Continuar
          <i data-lucide="arrow-right" class="h-4 w-4"></i>
        </button>

      </form>

      <p class="mt-5 text-center text-xs text-gray-500">
        Seus dados serão utilizados para configurar sua conta no NEKKO WD.
      </p>

    </section>

  </main>

  <script>
    lucide.createIcons();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/roles.js"></script>
  <script src="../../assets/js/bootstrap.js"></script>
  <script src="company.js"></script>

</body>
</html>
