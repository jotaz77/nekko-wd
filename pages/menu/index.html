<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <link
        rel="icon"
        type="image/png"
        href="../../assets/img/nekkologo_favicon.png"
    >

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nekko WD</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body
    class="
        bg-[#050806]
        text-white
        min-h-screen
        overflow-x-hidden
    "
>

    <!-- ========================================= -->
    <!-- BACKGROUND PREMIUM -->
    <!-- ========================================= -->

    <div
        class="
            fixed
            inset-0
            pointer-events-none
            overflow-hidden
        "
    >

        <!-- Glow principal -->

        <div
            class="
                absolute
                -top-72
                -left-72
                w-[850px]
                h-[850px]
                rounded-full
                bg-amber-400/[0.055]
                blur-[140px]
            "
        ></div>


        <!-- Glow secundário -->

        <div
            class="
                absolute
                top-[35%]
                -right-80
                w-[720px]
                h-[720px]
                rounded-full
                bg-amber-300/[0.04]
                blur-[130px]
            "
        ></div>


        <!-- Glow central -->

        <div
            class="
                absolute
                bottom-[-300px]
                left-1/2
                -translate-x-1/2
                w-[700px]
                h-[700px]
                rounded-full
                bg-amber-400/[0.025]
                blur-[120px]
            "
        ></div>


        <!-- Grid técnico -->

        <div
            class="
                absolute
                inset-0
                opacity-[0.16]
            "
            style="
                background-image:
                    linear-gradient(
                        rgba(255,255,255,0.025) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        90deg,
                        rgba(255,255,255,0.025) 1px,
                        transparent 1px
                    );
                background-size: 44px 44px;
            "
        ></div>


        <!-- Vinheta -->

        <div
            class="
                absolute
                inset-0
                bg-[radial-gradient(
                    circle_at_center,
                    transparent_0%,
                    rgba(0,0,0,.20)_60%,
                    rgba(0,0,0,.72)_100%
                )]
            "
        ></div>

    </div>



    <!-- ========================================= -->
    <!-- CONTEÚDO -->
    <!-- ========================================= -->

    <div
        class="
            relative
            z-10
            max-w-7xl
            mx-auto
            px-5
            md:px-8
            py-7
            md:py-10
        "
    >


        <!-- ===================================== -->
        <!-- HEADER -->
        <!-- ===================================== -->

        <header
            class="
                flex
                flex-col
                lg:flex-row
                lg:items-start
                lg:justify-between
                gap-6
                mb-10
                md:mb-14
            "
        >

            <!-- Marca -->

            <div>

                <div
                    class="
                        inline-flex
                        items-center
                        gap-2
                        px-3
                        py-1.5
                        rounded-full
                        bg-amber-400/5
                        border
                        border-amber-400/10
                        text-amber-300
                        text-[11px]
                        font-bold
                        uppercase
                        tracking-[0.22em]
                        mb-4
                    "
                >

                    <span
                        class="
                            w-1.5
                            h-1.5
                            rounded-full
                            bg-amber-300
                            shadow-[0_0_10px_rgba(74,222,128,.7)]
                        "
                    ></span>

                    Sistema de Gestão

                </div>


                <h1
                    class="
                        text-4xl
                        md:text-5xl
                        font-black
                        tracking-tight
                    "
                >

                    NEKKO
                    <span class="text-amber-300">
                        WD
                    </span>

                </h1>


                <p
                    class="
                        text-slate-500
                        mt-3
                        max-w-xl
                        leading-7
                    "
                >
                    Gestão completa para marceneiros,
                    projetos, materiais e serviços.
                </p>


                <!-- MODO -->

                <div
                    class="
                        flex
                        flex-wrap
                        items-center
                        gap-3
                        mt-5
                    "
                >

                    <span
                        id="modeBadge"
                        class="
                            hidden
                            inline-flex
                            items-center
                            gap-2
                            px-3
                            py-1.5
                            rounded-full
                            border
                            border-amber-400/20
                            bg-amber-400/10
                            text-amber-300
                            text-xs
                            font-bold
                            uppercase
                            tracking-wider
                        "
                    >

                        <span
                            class="
                                w-1.5
                                h-1.5
                                rounded-full
                                bg-amber-300
                            "
                        ></span>

                    </span>

                </div>

            </div>



            <!-- USUÁRIO -->

            <div
                class="
                    self-start
                    lg:self-auto
                    flex
                    items-center
                    gap-4
                    px-4
                    py-3
                    rounded-2xl
                    bg-[#0C110E]/80
                    border
                    border-[#202923]
                    backdrop-blur-xl
                "
            >

                <div
                    class="
                        w-10
                        h-10
                        rounded-xl
                        bg-amber-400/10
                        border
                        border-amber-400/10
                        flex
                        items-center
                        justify-center
                        text-amber-300
                        font-bold
                    "
                >

                    <i
                        data-lucide="user-round"
                        class="w-4 h-4"
                    ></i>

                </div>


                <div>

                    <p
                        class="
                            text-[11px]
                            uppercase
                            tracking-widest
                            text-slate-600
                        "
                    >
                        Usuário
                    </p>


                    <h2
                        id="userName"
                        class="
                            text-sm
                            font-semibold
                            text-slate-200
                            mt-0.5
                        "
                    >
                        Usuário
                    </h2>

                </div>

            </div>

        </header>



        <!-- ===================================== -->
        <!-- LOJA ATUAL -->
        <!-- ===================================== -->

        <section
            class="
                relative
                mb-10
                md:mb-12
            "
        >

            <div
                class="
                    bg-[#0C110E]/85
                    border
                    border-[#202923]
                    rounded-[30px]
                    px-6
                    py-7
                    md:px-8
                    md:py-8
                    backdrop-blur-xl
                    shadow-2xl
                    overflow-hidden
                "
            >

                <!-- detalhe -->

                <div
                    class="
                        absolute
                        top-0
                        left-0
                        w-40
                        h-px
                        bg-gradient-to-r
                        from-amber-300/70
                        to-transparent
                    "
                ></div>


                <div
                    class="
                        flex
                        flex-col
                        md:flex-row
                        md:items-center
                        md:justify-between
                        gap-5
                    "
                >

                    <div>

                        <p
                            class="
                                text-[11px]
                                text-slate-600
                                uppercase
                                tracking-[0.24em]
                                font-bold
                            "
                        >
                            Empresa atual
                        </p>


                        <h2
                            id="currentStore"
                            class="
                                text-2xl
                                md:text-3xl
                                font-black
                                mt-2
                            "
                        >
                            Carregando...
                        </h2>

                    </div>


                    <div
                        class="
                            inline-flex
                            items-center
                            gap-2
                            self-start
                            md:self-auto
                            px-3.5
                            py-2
                            rounded-full
                            bg-amber-400/5
                            border
                            border-amber-400/10
                            text-amber-300
                            text-xs
                            font-semibold
                        "
                    >

                        <span
                            class="
                                w-2
                                h-2
                                rounded-full
                                bg-amber-300
                                shadow-[0_0_8px_rgba(74,222,128,.7)]
                            "
                        ></span>

                        Sistema online

                    </div>

                </div>

            </div>

        </section>



        <!-- ===================================== -->
        <!-- MENU -->
        <!-- ===================================== -->

        <section>

            <div
                class="
                    flex
                    items-end
                    justify-between
                    gap-4
                    mb-5
                "
            >

                <div>

                    <p
                        class="
                            text-xs
                            uppercase
                            tracking-[0.2em]
                            text-amber-300/70
                            font-bold
                        "
                    >
                        Navegação
                    </p>


                    <h3
                        class="
                            text-2xl
                            font-bold
                            mt-1
                        "
                    >
                        Módulos
                    </h3>

                </div>


                <p
                    class="
                        hidden
                        md:block
                        text-xs
                        text-slate-600
                    "
                >
                    Acesse rapidamente cada área
                </p>

            </div>


            <div
                id="menuGrid"
                class="
                    grid
                    grid-cols-2
                    md:grid-cols-3
                    xl:grid-cols-4
                    gap-4
                    md:gap-5
                "
            >

            </div>

        </section>



        <!-- ===================================== -->
        <!-- FOOTER -->
        <!-- ===================================== -->

        <footer
            class="
                text-center
                mt-20
                md:mt-24
                mb-8
                select-none
            "
        >

            <div
                class="
                    w-12
                    h-px
                    bg-amber-400/20
                    mx-auto
                    mb-6
                "
            ></div>


            <h2
                class="
                    text-slate-700
                    uppercase
                    tracking-[0.55em]
                    text-xs
                    font-bold
                "
            >
                NEKKO WD
            </h2>


            <p
                class="
                    text-slate-600
                    text-[11px]
                    mt-3
                    tracking-wide
                "
            >
                Sistema de Gestão para Marcenaria
            </p>

        </footer>

    </div>



    <!-- ========================================= -->
    <!-- SCRIPTS -->
    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/supabase.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/bootstrap.js"></script>
    <script src="../../assets/js/roles.js"></script>

    <script src="index.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
