<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nekko WD • Novo Projeto</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--wd:#c65a16;--wd-dark:#8f3d0d}
body{background:#090909;color:#f5f5f5}
.input{width:100%;background:#111;border:1px solid #292929;border-radius:12px;padding:12px;outline:none}
.input:focus{border-color:var(--wd);box-shadow:0 0 0 3px #c65a1625}
.card{background:#101010;border:1px solid #292929;border-radius:20px;padding:24px}
.btn{background:var(--wd);border-radius:12px;padding:12px 18px;font-weight:700}
</style>
</head>
<body>
<main class="max-w-5xl mx-auto p-5 md:p-8">
<header class="flex flex-wrap items-center justify-between gap-4 mb-8">
<div><p class="text-orange-500 text-sm font-bold tracking-widest">NEKKO WD</p><h1 class="text-3xl font-black">Novo projeto de marcenaria</h1><p class="text-zinc-400 mt-1">Cadastre um serviço completo para seu cliente.</p></div>
<a href="./index.html" class="text-zinc-300 hover:text-orange-400">Voltar para serviços</a>
</header>
<form id="projectForm" class="space-y-6">
<section class="card"><h2 class="text-xl font-bold mb-4">Cliente</h2><div class="grid md:grid-cols-2 gap-4">
<input class="input" name="customer_name" placeholder="Nome do cliente *" required>
<input class="input" name="customer_document" placeholder="CPF/CNPJ">
<input class="input" name="customer_phone" placeholder="Telefone">
<input class="input" name="customer_whatsapp" placeholder="WhatsApp">
<input class="input md:col-span-2" name="customer_address" placeholder="Endereço completo">
</div></section>
<section class="card"><h2 class="text-xl font-bold mb-4">Ambiente</h2><div class="grid md:grid-cols-2 gap-4">
<select class="input" name="environment_type"><option value="">Tipo de ambiente</option><option>Cozinha</option><option>Sala</option><option>Sala de jantar</option><option>Quarto</option><option>Banheiro</option><option>Escritório</option><option>Outro</option></select>
<input class="input" name="project_name" placeholder="Nome do projeto *" required>
<input class="input" name="width" type="number" step="0.01" placeholder="Largura (m)">
<input class="input" name="length" type="number" step="0.01" placeholder="Comprimento (m)">
<input class="input" name="height" type="number" step="0.01" placeholder="Altura (m)">
<input class="input" id="area" placeholder="Área calculada (m²)" readonly>
</div></section>
<section class="card"><h2 class="text-xl font-bold mb-4">Serviço e material</h2><div class="grid md:grid-cols-2 gap-4">
<input class="input" name="service_name" placeholder="O que será produzido *" required>
<select class="input" name="material_type"><option value="">Material</option><option>MDF</option><option>MDP</option><option>Madeira maciça</option><option>Compensado</option><option>Outro</option></select>
<input class="input" name="material_color" placeholder="Cor/acabamento">
<input class="input" name="material_thickness" placeholder="Espessura">
<input class="input" name="estimated_value" type="number" step="0.01" placeholder="Valor estimado (R$)">
<input class="input" name="estimated_deadline" placeholder="Prazo estimado">
<textarea class="input md:col-span-2" name="description" rows="4" placeholder="Descrição do projeto"></textarea>
<textarea class="input md:col-span-2" name="notes" rows="3" placeholder="Observações"></textarea>
</div></section>
<div class="flex justify-end gap-3"><a href="./index.html" class="px-5 py-3 rounded-xl border border-zinc-700">Cancelar</a><button class="btn" type="submit">Salvar projeto</button></div>
<p id="feedback" class="text-sm text-zinc-400"></p>
</form>
</main>
<script src="../../assets/js/config.js"></script><script src="../../assets/js/supabase.js"></script><script src="../../assets/js/storage.js"></script><script src="../../assets/js/auth.js"></script><script src="./create.js"></script>
</body></html>
